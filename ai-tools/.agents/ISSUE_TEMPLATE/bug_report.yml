name: Bug Report
description: File a bug report to help us improve the Horizon 2 UI.
title: "[SP0168] "
labels: [bug]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Complete as much detail as possible so the triage workflow (Jira Ticket Review) can act on it quickly.
  - type: input
    id: ticket
    attributes:
      label: Jira Ticket
      description: Jira ticket key if one exists.
      placeholder: "SP0168-1234"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: "When I ..., the UI ... while it should ..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps, including the exact route/URL and inputs used.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll/trigger '...'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected Area
      description: Which part of the application is affected?
      multiple: true
      options:
        - Embedded
        - Tracker
        - Admin
        - Shared components
        - Styling / SCSS
        - Services / State (NgRx/RxJS)
        - Build / Tooling
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & Version
      placeholder: "Chrome 126"
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Console errors, screenshots, or related test/build logs.
      placeholder: "Paste console output or drag screenshots here."
    validations:
      required: false
  - type: textarea
    id: related-reports
    attributes:
      label: Related Context Reports
      description: Any existing `*.ctx.md` reports from `.agents/reports/` related to this bug.
      placeholder: ".agents/reports/BUG-REPORT-SP0168-XXX-YYYYMMDD-HHMM.ctx.md"
    validations:
      required: false