name: Feature Request
description: Request a new feature or enhancement for the Horizon 2 UI.
title: "[SP0168] "
labels: [enhancement]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Provide enough detail so the Feature Delivery workflow can scope the technical design.
  - type: input
    id: ticket
    attributes:
      label: Jira Ticket
      description: Jira ticket key if one exists.
      placeholder: "SP0168-1234"
    validations:
      required: false
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What should the feature do? Include the user story / business context.
      placeholder: "As a user, I want to ... so that ..."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Concrete, testable criteria that define when this feature is done.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected Area
      description: Which part of the application would this affect?
      multiple: true
      options:
        - Embedded
        - Tracker
        - Admin
        - Shared components
        - Styling / SCSS
        - Services / State (NgRx/RxJS)
        - Build / Tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes (optional)
      description: Any constraints, dependencies, or architectural considerations.
      placeholder: "Relevant RxJS flows, NgRx stores, backend APIs, or existing components to reuse."
    validations:
      required: false
  - type: textarea
    id: related-reports
    attributes:
      label: Related Context Reports
      description: Any existing `*.ctx.md` reports from `.github/reports/` related to this feature.
      placeholder: ".github/reports/ENGINEERING-REPORT-<FEATURE>-YYYYMMDD-HHMM.ctx.md"
    validations:
      required: false